name: Update pro.plus rules

on:
  schedule:
    # 每天 UTC 00:30 运行（北京时间 08:30）
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 生成 pro.plus.json 和 pro.plus.list
        run: python3 scripts/build.py

      - name: 安装 sing-box
        run: curl -fsSL https://sing-box.app/install.sh | sh

      - name: 编译 pro.plus.srs
        run: sing-box rule-set compile --output rules/pro.plus.srs rules/pro.plus.json

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/pro.plus.json rules/pro.plus.list rules/pro.plus.srs
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新 pro.plus 规则 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
